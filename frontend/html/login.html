<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
   <link rel="stylesheet" href="/frontend/css/login.css">
   <link rel="icon" href="/frontend/images/bird.png">
</head>
<body>
    <div class="square">

          <p id="signup">signup</p>
          <a id="here" href="/frontend/html/signuppage.html">here</a>

    </div>

    <div class="circle"></div>

   

    

    <p class="text" >Login</p>
    
    <p class="wrong" id="wrong"> </p>



      <a href="/frontend/html/homepage.html">
    <p class="logo">KONICHIWA</p>
     <div class="square2"></div>
    </a>

    <input type="email" class="email-input" id="email" placeholder="Email">

    <input type="password" class="password-input"id="password" placeholder="password">
    
     <button class="button" onclick="checkNumber()">Login</button>







          <script>
function checkNumber() {
  const password = document.getElementById('password').value;
   const email = document.getElementById('email').value;

  fetch(`/api/login?password=${password}&email=${email}`)
    .then(res => res.json())
    .then(data => {
     if (data.checker == "approved") {
      localStorage.setItem("email", email);
      window.location.href = "/frontend/html/new.html";
    } else { 
      document.getElementById('wrong').innerText = "wrong email or password";
 }
    });
}
</script>


    </body>
</html>
