<!-- current user name -->
<p id="message">W</p>

<script>
  fetch('/api/message')
    .then(res => res.json())
    .then(data => {
      document.getElementById('apiText').innerText = data.message;
    });
</script>
<!-- current user name -->




<!-- number display -->
<h2 id="message" style="font-size: 100px;">  </h2>

<script>
  fetch('/api/check')
    .then(res => res.json())
    .then(data => {
      document.getElementById('message').innerText = data.number;
    });
</script>
<!-- number display -->



<!-- number uploader -->
<input type="text" id="numInput" placeholder="Type">
<button onclick="checkNumber()" id="button">Post</button>

<script>
function checkNumber() {
  const value = document.getElementById('numInput').value;

  fetch(`/api/check?number=${value}`)
    .then(res => res.json())
    .then(data => {
      document.getElementById('apiText').innerText = data.number;
    });
}
const email = localStorage.getItem("email");
</script>
