<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="/frontend/css/new.css">
  <title>API Test</title>
</head>
<body>


  <div class="logosquare">
    <p class="logo">KONICHIWA</p>
    </div>


      <div class="input-area">
  <input type="text" id="numInput">
  <button onclick="checkNumber()" id="button">Post</button>
</div>



    <div id="square">

    <p id="chat">CHAT</p>
      
</div>
    

 
                                         <!-- API FETCH -->


<!-- current user name -->


<!-- number display -->
<h2 id="message" style="font-size: 100px;">  </h2>

<script>
  fetch('/api/check')
    .then(res => res.json())
    .then(data => {
      document.getElementById('message').innerText = data.number;
    });
</script>
<!-- number display -->



<!-- number uploader -->

<p id="chatvalue"></p>

<script>
  fetch('/api/showchat')
    .then(res => res.json())
    .then(data => {
      document.getElementById('chatvalue').innerText = data.message;
    });
</script>

<!-- number uploader -->



<!-- number uploader -->

<script>
function checkNumber() {
  const value = document.getElementById('numInput').value;

  fetch(`/api/chat?input=${value}`)
    .then(res => res.json())
    .then(data => {
      document.getElementById('chatvalue').innerText = data.message;
    });
}

</script>

<!-- number uploader -->



</body>
</html>
