<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="/frontend/css/new.css">
  <title>API Test</title>
</head>
<body>

   <p class="logo">KONICHIWA</p>
     <div class="square2"></div>


      <div class="square3"></div>



    <div class="square"></div>

    <p id="chat">CHAT</p>
      <p id="chatvalue"></p>

    

 
                                         <!-- API FETCH -->


<!-- current user name -->
<p id="message1"></p>

<script>
  fetch('/api/message')
    .then(res => res.json())
    .then(data => {
      document.getElementById('message1').innerText = data.message;
    });
</script>
<!-- current user name -->




<!-- number display -->
<h2 id="message" style="font-size: 100px;">  </h2>

<script>
  fetch('/api/check')
    .then(res => res.json())
    .then(data => {
      document.getElementById('message').innerText = data.number;
    });
</script>
<!-- number display -->



<!-- number uploader -->
<input type="text" id="numInput" placeholder="Type">
<button onclick="checkNumber()" id="button">Post</button>

<script>
function checkNumber() {
  const value = document.getElementById('numInput').value;

  fetch(`/api/chat?input=${value}`)
    .then(res => res.json())
    .then(data => {
      document.getElementById('chatvalue').innerText = data.message;
    });
}

</script>

<!-- number uploader -->



</body>
</html>
