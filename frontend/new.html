<!DOCTYPE html>
<html>
<head>
  <title>API Test</title>
</head>
<body>

<h1>Testing API...</h1>

<p id="apiText">Waiting...</p>

<script>
  fetch('/api/message')
    .then(res => res.json())
    .then(data => {
      document.getElementById('apiText').innerText = data.message;
    });
</script>

</body>
</html>
