<!DOCTYPE html>
<html>
<head>
  <title>API Test</title>
</head>
<body>

</h1>Construction ahead...</h1>

<p id="apiText">Waiting...</p>

<script>
  fetch('/api/message')
    .then(res => res.json())
    .then(data => {
      document.getElementById('apiText').innerText = data.message;
    });
</script>

<input type="text" id="numInput" placeholder="Enter number">
<button onclick="checkNumber()">Check</button>

<script>
function checkNumber() {
  const value = document.getElementById('numInput').value;

  fetch(`/api/check?number=${value}`)
    .then(res => res.json())
    .then(data => {
      if (data.correct) {
        document.body.style.backgroundColor = "green";
      } else {
        document.body.style.backgroundColor = "white";
      }
    });
}
</script>

</body>
</html>
