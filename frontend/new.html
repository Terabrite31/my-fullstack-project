<!DOCTYPE html>
<html>
<head>
  <title>API Test</title>
</head>
<body>

</h1>Construction ahead...</h1>

<p id="apiText">Waiting...</p>

<p id="thenumber" style="font-size: 100px;">  </p>

<script>
  fetch('/api/message')
    .then(res => res.json())
    .then(data => {
      document.getElementById('thenumber').innerText = data.message;
    });
</script>

<script>
  fetch('/api/check')
    .then(res => res.json())
    .then(data => {
      document.getElementById('apiText').innerText = data.number;
    });
</script>

<script>
function checkNumber() {
  const value = document.getElementById('numInput').value;

  fetch(`/api/check?number=${value}`)
    .then(res => res.json())
    .then(data => {
      document.getElementById('apiText').innerText = data.number;
    });
}
</script>



<input type="text" id="numInput" placeholder="Enter number">
<button onclick="checkNumber()">Check</button>



</body>
</html>
